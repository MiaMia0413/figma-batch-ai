<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figma Batch AI</title>
    <style>
      :root {
  color-scheme: light dark;
  --bg: var(--figma-color-bg, #ffffff);
  --panel: var(--figma-color-bg-secondary, #f6f7f9);
  --text: var(--figma-color-text, #111827);
  --muted: var(--figma-color-text-secondary, #6b7280);
  --border: var(--figma-color-border, #d9dce3);
  --brand: #2563eb;
  --brand-text: #ffffff;
  --danger: #dc2626;
  --radius: 8px;
  --composer-control-height: 56px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font:
    12px/1.45 Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.title {
  min-width: 0;
}

.title h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.title p {
  margin: 2px 0 0;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 6px;
  align-items: center;
}

.icon-button {
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
}

.icon-button svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-button:hover {
  border-color: var(--brand);
}

.messages {
  overflow: auto;
  padding: 12px;
}

.message {
  margin: 0 0 10px;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user {
  background: color-mix(in srgb, var(--brand) 12%, var(--bg));
  border-color: color-mix(in srgb, var(--brand) 35%, var(--border));
}

.message.tool {
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}

.composer {
  position: relative;
  padding: 10px;
  border-top: 1px solid transparent;
  background: var(--bg);
}

.composer.quick-actions-open {
  border-top-color: var(--border);
}

.quick-actions {
  position: relative;
  min-height: 0;
  padding: 0;
}

.quick-actions-toggle {
  position: absolute;
  z-index: 2;
  top: -19px;
  left: 50%;
  width: 28px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  padding: 0;
  cursor: pointer;
  transform: translateX(-50%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
}

.quick-actions-toggle:hover {
  border-color: var(--brand);
  color: var(--text);
}

.quick-actions-arrow {
  display: inline-block;
  width: 11px;
  height: 11px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: rotate(0deg);
  transition: transform 0.16s ease;
}

.quick-actions-toggle.open .quick-actions-arrow {
  transform: rotate(180deg);
}

.quick-actions-list {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 8px;
}

.quick-actions-list[hidden] {
  display: none;
}

.chip {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel);
  color: var(--text);
  padding: 5px 8px;
  cursor: pointer;
}

.chip:hover {
  border-color: var(--brand);
}

.input-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: stretch;
}

.composer-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 6px;
  align-items: stretch;
}

textarea {
  width: 100%;
  min-height: var(--composer-control-height);
  max-height: 140px;
  resize: vertical;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  padding: 8px;
}

.primary {
  border: 0;
  border-radius: var(--radius);
  background: var(--brand);
  color: var(--brand-text);
  padding: 9px 12px;
  font-weight: 700;
  cursor: pointer;
}

.primary:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.run-toggle {
  min-width: 54px;
  min-height: var(--composer-control-height);
  height: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
}

.primary.danger {
  background: var(--danger);
}

textarea:disabled {
  cursor: not-allowed;
  opacity: 0.72;
}

.settings {
  position: fixed;
  inset: 0;
  display: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  padding: 12px;
}

.edit-confirm {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  align-items: end;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  padding: 10px;
}

.edit-confirm-panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
  padding: 12px;
}

.edit-confirm-panel h2 {
  margin: 0 0 8px;
  font-size: 13px;
}

.edit-confirm-panel p {
  margin: 8px 0;
  color: var(--muted);
}

.edit-confirm-note {
  font-size: 12px;
}

.edit-confirm-error {
  border: 1px solid color-mix(in srgb, var(--danger) 42%, var(--border));
  border-radius: 6px;
  background: color-mix(in srgb, var(--danger) 10%, transparent);
  color: var(--danger) !important;
  padding: 7px 8px;
}

.edit-confirm-meta {
  display: grid;
  gap: 4px;
  color: var(--muted);
}

.edit-confirm-list {
  max-height: 156px;
  overflow: auto;
  margin: 8px 0 10px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  list-style: none;
}

.edit-confirm-list li {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}

.edit-confirm-list li:last-child {
  border-bottom: 0;
}

.edit-confirm-list span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.edit-confirm-list em {
  color: var(--muted);
  font-style: normal;
}

.edit-confirm-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.settings.open {
  display: grid;
  align-items: start;
}

.settings-panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
}

.settings-panel h2 {
  margin: 0 0 10px;
  font-size: 13px;
}

label {
  display: grid;
  gap: 4px;
  margin-bottom: 9px;
  color: var(--muted);
}

input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  padding: 7px 8px;
}

select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  padding: 7px 8px;
}

.font-fallback {
  display: grid;
  gap: 6px;
  margin: 8px 0;
  padding: 8px;
  border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--border));
  border-radius: 6px;
  background: color-mix(in srgb, var(--danger) 8%, var(--bg));
}

.font-fallback strong {
  color: var(--text);
}

.font-fallback label {
  margin: 0;
}

.quick-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.quick-buttons button {
  border: 1px solid var(--border);
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 92%, var(--brand));
  color: var(--text);
  padding: 4px 7px;
  font-size: 11px;
  line-height: 1.2;
  cursor: pointer;
}

.quick-buttons button:hover {
  border-color: var(--brand);
}

.settings-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.secondary {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  padding: 8px 10px;
  cursor: pointer;
}

.secondary:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.danger-text {
  color: var(--danger);
}

.status {
  margin-top: 6px;
  color: var(--muted);
  min-height: 18px;
}

.error {
  color: var(--danger);
}

    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="title">
          <h1>Figma Batch AI</h1>
          <p>用自然语言批量修改已有设计稿</p>
        </div>
        <div class="header-actions">
          <button id="clearButton" class="icon-button" type="button" title="清空对话" aria-label="清空对话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M6 6l1 15h10l1-15" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
            </svg>
          </button>
          <button id="settingsButton" class="icon-button" title="设置" aria-label="设置">⚙</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section class="composer">
        <div id="quickActions" class="quick-actions">
          <button
            id="quickActionsToggle"
            class="quick-actions-toggle"
            type="button"
            aria-label="展开快捷指令"
            aria-expanded="false"
            aria-controls="quickActionsList"
          >
            <svg class="quick-actions-arrow" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6l4 4 4-4" />
            </svg>
          </button>
          <div id="quickActionsList" class="quick-actions-list" hidden>
            <button class="chip" data-prompt="分析当前设计稿，总结可以批量修改的内容">分析画布</button>
            <button class="chip" data-prompt="检查当前设计稿中的设计一致性问题">设计检查</button>
            <button class="chip" data-prompt="把相似图层重命名为清晰统一的产品 UI 命名">重命名</button>
          </div>
        </div>
        <div class="input-row">
          <textarea id="prompt" placeholder="告诉 AI 你想如何修改设计稿..."></textarea>
          <div class="composer-actions">
            <button id="runToggleButton" class="primary run-toggle" type="button">运行</button>
          </div>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>

    <aside id="settings" class="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <form id="settingsForm" class="settings-panel">
        <h2 id="settingsTitle">模型设置</h2>
        <label>
          API Key
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <label>
          Endpoint 地址
          <input id="endpoint" type="url" placeholder="https://api.openai.com/v1" />
          <span class="quick-buttons" aria-label="Endpoint 快捷选项">
            <button type="button" data-target="endpoint" data-value="https://api.openai.com/v1">
              OpenAI
            </button>
            <button type="button" data-target="endpoint" data-value="https://api.deepseek.com/v1">
              DeepSeek
            </button>
            <button
              type="button"
              data-target="endpoint"
              data-value="https://dashscope.aliyuncs.com/compatible-mode/v1"
            >
              DashScope
            </button>
            <button type="button" data-target="endpoint" data-value="https://open.bigmodel.cn/api/paas/v4">
              Zhipu
            </button>
            <button type="button" data-target="endpoint" data-value="https://openrouter.ai/api/v1">
              OpenRouter
            </button>
          </span>
        </label>
        <label>
          模型
          <input id="model" type="text" placeholder="gpt-4o-mini" />
          <span class="quick-buttons" aria-label="模型快捷选项">
            <button type="button" data-target="model" data-value="gpt-4o-mini">GPT-4o mini</button>
            <button type="button" data-target="model" data-value="deepseek-chat">DeepSeek Chat</button>
            <button type="button" data-target="model" data-value="qwen-plus">Qwen Plus</button>
            <button type="button" data-target="model" data-value="glm-4-flash">GLM-4 Flash</button>
            <button type="button" data-target="model" data-value="openrouter/auto">OpenRouter Auto</button>
          </span>
        </label>
        <div class="settings-actions">
          <button type="button" id="closeSettings" class="secondary">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
        <div id="settingsStatus" class="status"></div>
      </form>
    </aside>
